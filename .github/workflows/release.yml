name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by wait-for-ci to read the CI run for this commit. `contents: write`
  # alone does not grant it, and the API call would fail closed with a 403.
  actions: read

jobs:
  # Gate the release on CI. Without this, the two workflows run in PARALLEL on a
  # tag push, so a tag whose CI is red still publishes images: v3.4.1 shipped a
  # mount-prefix regression to Docker Hub exactly this way (Release `success`,
  # CI `failure` at the same second), and the broken `:3.4.1` / `:3.4` / `:latest`
  # tags had to be superseded by a patch release.
  #
  # `workflow_run` is not used because it only triggers on the default branch's
  # workflow; instead this job waits on the CI run CI itself started for the same
  # commit, via the API, and fails the release when that run is not green.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # CI runs for the same push, so allow a short window for the run to
          # appear before treating its absence as a failure.
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push")] | sort_by(.created_at) | last | .id // empty')" || true
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No push CI run found for $SHA; refusing to publish an image"
            exit 1
          fi
          echo "Waiting for CI run $run_id - https://github.com/$REPO/actions/runs/$run_id"

          # Poll the conclusion rather than using `gh run watch --exit-status`,
          # which needs a newer gh than every runner image ships.
          for _ in $(seq 1 80); do
            status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.conclusion')"
              if [ "$conclusion" != "success" ]; then
                echo "::error::CI concluded '$conclusion' for $SHA; refusing to publish an image"
                exit 1
              fi
              echo "CI is green for $SHA; proceeding with the release"
              exit 0
            fi
            sleep 30
          done
          echo "::error::CI did not finish within the wait window for $SHA"
          exit 1

  release:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zichuanlan/meta-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release body is the version's CHANGELOG section, so the notes carry
      # the actual changes instead of the generated "Full Changelog" line alone.
      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          # CHANGELOG headings keep the tag's "v" prefix (## [v2.5.2]).
          tag="${GITHUB_REF_NAME}"
          awk -v ver="$tag" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No [$tag] section in CHANGELOG.md; falling back to generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub release
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      - name: Create GitHub release (generated notes)
        if: steps.changelog.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
