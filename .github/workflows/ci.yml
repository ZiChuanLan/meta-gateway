name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # `-race` is the long pole, not the frontend or the E2E job. It instruments
    # pure-Go SQLite (modernc.org/sqlite), so every SQLite call is instrumented.
    #
    # Both budgets have been hit for real, so they are sized against
    # measurements rather than guesses:
    #
    #   step `go test -race` wall time
    #     baseline (754afa1 and earlier)   863s - 1,112s   all green
    #     1cb754b (the V4 commit)         1,304s / 1,720s  both RED
    #     budget raised to 30m, no other   1,959s          still RED
    #     change
    #     after store.OpenTest (local)        472s          green
    #
    # The old per-package `-timeout` was 20m (1,200s), which the baseline was
    # already eating 72%-93% of; the V4 commit pushed one package past it. A
    # package timeout is reported as a plain failure, so the step went red on a
    # suite that reported no DATA RACE — a real race fails in seconds.
    #
    # Raising the limit did not help, and that is the lesson: the cost was
    # per-test migration replay (~300 tests x 3.4s under -race), and the fix was
    # to remove it (store.OpenTest copies a once-per-process template). The
    # budget is now a safety net again, not a workaround.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Admin dependencies
        working-directory: web
        run: npm ci
      - name: Verify Web Admin
        working-directory: web
        run: |
          npm run lint
          # Prettier is the formatting gate: the sheets under src/styles and
          # src/themes are excluded (see .prettierignore), everything else is
          # checked, so a hand-formatted JSX block cannot land unreviewed.
          npm run format:check
          npm run audit:entrypoints
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated docs are current
        # docs/reference is generated FROM the code, so the drift it is meant to
        # catch appears when internal/ changes — not when docs/ does. That is why
        # the gate lives here and not in the Docs workflow, which only runs on
        # docs/** paths and would therefore miss it entirely.
        run: |
          go run ./tools/docsgen
          if ! git diff --exit-code -- docs/reference; then
            echo "::error::docs/reference 与代码不一致。请在本地运行 'go run ./tools/docsgen' 并提交结果。"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Unreachable code
        run: |
          result="$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test ./...)"
          if [ -n "$result" ]; then
            printf '%s\n' "$result"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Race test
        # -timeout applies per package. 20m is roughly 3x the slowest package
        # measured after store.OpenTest (internal/httpapi, 413s locally), which
        # absorbs run-to-run variance on shared runners while still bounding a
        # genuine deadlock. It is a ceiling, not a cost: wall time is decided by
        # the tests, so the number only matters when something hangs.
        #
        # Keep tests off the per-test migration replay (store.OpenTest); that is
        # what turned this step into a 30-minute one and then into a red one.
        run: go test -race -timeout 20m ./...
      - name: Build
        run: go build -trimpath ./cmd/server
      - name: Validate Compose
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose config --quiet
      # The update executor is a shell script, so it needs its own gate: it is the
      # component that runs `docker compose up` against a real deployment, and a
      # bug there is only visible after an operator has already clicked update.
      # The fakes keep it hermetic (no Docker, no network).
      - name: Compose updater contract
        run: sh tools/compose-updater/update_test.sh
      - name: Compose E2E
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --build --detach --wait --wait-timeout 90 meta-gateway mock-upstream
          test "$(docker compose exec -T meta-gateway id -u)" = "10001"
          curl --fail --silent http://127.0.0.1:4100/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4100/metrics)" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            http://127.0.0.1:4100/metrics | grep -q '^meta_gateway_ready 1$'
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml restart meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --detach --wait --wait-timeout 90 meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            run --rm e2e verify
      - name: Compose diagnostics
        if: failure()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: Compose cleanup
        if: always()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
