name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # `-race` is the long pole, not the frontend or the E2E job. It instruments
    # pure-Go SQLite, and every test that opens a fresh database replays every
    # migration: ~3.4s under -race versus ~0.14s without (measured). That makes
    # internal/store ~500s and internal/httpapi ~700s on their own.
    #
    # Both budgets have now been hit for real, so they are sized against
    # measurements rather than guesses:
    #
    #   step `go test -race` wall time, 12 consecutive CI runs
    #     baseline (754afa1 and earlier)   863s - 1,112s   all green
    #     1cb754b (the V4 commit)         1,304s / 1,720s  both RED
    #
    # The per-package `-timeout` was 20m (1,200s), which the baseline was already
    # eating 72%-93% of. The V4 commit pushed one package past it, and because a
    # package timeout is reported as a plain failure, the step went red on a
    # suite that reported no DATA RACE. Budget for the step instead of gambling
    # on it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Admin dependencies
        working-directory: web
        run: npm ci
      - name: Verify Web Admin
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated docs are current
        # docs/reference is generated FROM the code, so the drift it is meant to
        # catch appears when internal/ changes — not when docs/ does. That is why
        # the gate lives here and not in the Docs workflow, which only runs on
        # docs/** paths and would therefore miss it entirely.
        run: |
          go run ./tools/docsgen
          if ! git diff --exit-code -- docs/reference; then
            echo "::error::docs/reference 与代码不一致。请在本地运行 'go run ./tools/docsgen' 并提交结果。"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        # -timeout applies per package. 30m is a real margin over the slowest
        # package rather than a coin flip: the whole step now measures up to
        # 1,720s, and the previous 20m limit is exactly what turned the V4
        # commit red (see the job comment above for the numbers). It still
        # bounds a genuine deadlock, and a DATA RACE still fails in seconds.
        #
        # The actual fix is to stop paying the per-test migration replay: migrate
        # one template database per package and copy it for each test. That would
        # take the suite from ~20 minutes to a couple, and this budget back to
        # something honest.
        run: go test -race -timeout 30m ./...
      - name: Build
        run: go build -trimpath ./cmd/server
      - name: Validate Compose
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose config --quiet
      - name: Compose E2E
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --build --detach --wait --wait-timeout 90 meta-gateway mock-upstream
          test "$(docker compose exec -T meta-gateway id -u)" = "10001"
          curl --fail --silent http://127.0.0.1:4100/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4100/metrics)" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            http://127.0.0.1:4100/metrics | grep -q '^meta_gateway_ready 1$'
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml restart meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --detach --wait --wait-timeout 90 meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            run --rm e2e verify
      - name: Compose diagnostics
        if: failure()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: Compose cleanup
        if: always()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
