name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # `-race` is the long pole, not the frontend or the E2E job. It instruments
    # pure-Go SQLite, and every test that opens a fresh database replays all
    # 101 migrations: ~3.4s under -race versus ~0.14s without (measured). That
    # makes internal/store ~500s and internal/httpapi ~700s on their own, so
    # the 10-minute *default* per-package -timeout sat on the cliff — the
    # 2026-09-17 run finished internal/httpapi at 504.9s, and a later run had
    # internal/store pass at 599.8s with 0.2s to spare. Budget for the step
    # instead of gambling on it.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Admin dependencies
        working-directory: web
        run: npm ci
      - name: Verify Web Admin
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        # -timeout applies per package. 20m is roughly double the worst package
        # measured (internal/httpapi, ~700s) which absorbs the ~30% run-to-run
        # variance we see on shared runners, while still bounding a genuine
        # deadlock. A race failure here is a real finding: the instrumented
        # suite is clean, and the only thing that used to fail the step was the
        # timeout, on a suite that reported no DATA RACE.
        run: go test -race -timeout 20m ./...
      - name: Build
        run: go build -trimpath ./cmd/server
      - name: Validate Compose
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose config --quiet
      - name: Compose E2E
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --build --detach --wait --wait-timeout 90 meta-gateway mock-upstream
          test "$(docker compose exec -T meta-gateway id -u)" = "10001"
          curl --fail --silent http://127.0.0.1:4100/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:4100/metrics)" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            http://127.0.0.1:4100/metrics | grep -q '^meta_gateway_ready 1$'
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml restart meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up --detach --wait --wait-timeout 90 meta-gateway
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            run --rm e2e verify
      - name: Compose diagnostics
        if: failure()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: Compose cleanup
        if: always()
        env:
          ADMIN_TOKEN: ci-admin-token
          MASTER_KEY: ci-master-key-at-least-32-characters
          METRICS_TOKEN: ci-metrics-token
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
